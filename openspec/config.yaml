schema: spec-driven

context: |
  Company: Savills Asia Pacific (Vietnam), Project Management (PM) department.
  Project: Budget Agent. It turns one filled input workbook (Project_Budget_Input.xlsx) into a
  Savills 2027 Resi budget proposal for a new property: the client deliverable on Savills'
  standard 25-sheet budget form, an internal analysis workbook that shows the reasoning behind
  every figure, and a shift roster. The PM team uses it to cut proposal preparation from days
  to about a minute.

  Tech stack: Python 3.14 and openpyxl; no framework. Microsoft Excel is used only by verification.
  Reference data are CSV files under data/; the pipeline reads them directly and joins nothing
  (docs/10-data-layer-assessment.md).

  Where things are:
  - How to run: source_code/RUNNING.md. Module map: source_code/README.md.
  - Current state and open work: docs/project-status.md. Business decisions: docs/05-decisions.md.
  - This `source_code/` folder is the live code. `legacy/` holds retired modules. The
    `PM/Project_Clone*` folders are copies: ask before changing one.
  - Costing follows the AI Guideline form and the logic file. Comparables used for estimating
    come from the 8 detailed project budgets, except the Required lines with no other price
    (EMB4, ESS12, ESC5, ESS7, ESS23, ESC1, ESC2), which are priced from the anonymous range of
    real Savills budgets in data/real_budget_ranges/ (decided 2026-10-12, change use-real-budget-ranges).

  Conventions:
  - Write proposals and specs in plain, non-technical language a PM or Finance reader can review.
  - Money and headcount figures must state currency (VND/USD) and unit explicitly in any spec or
    report change.
  - A change that moves a figure on the client deliverable needs a measured before/after and the
    PM's sign-off before it is archived.
  - Remarks on the client deliverable are in Vietnamese (docs/11 to 13).

rules:
  specs:
    - State which data files the change reads or writes, and whether any recorded baseline figure moves.
  tasks:
    - Where a figure can move, include a before/after measurement on one project and name who signs it off.
    - Finish with `python verification/verify.py`, run from Budget_Agent/source_code/, passing.
